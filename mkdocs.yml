site_name: FadianRoam Blueprint
site_url: https://fadianroam.yunzheng.space
site_description: FadianRoam — An eduroam-like roaming network federation
site_author: FadianRoam Project

repo_url: https://github.com/FadianRoam/fadianroam-blueprint
repo_name: FadianRoam/fadianroam-blueprint

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
  font:
    text: Roboto Mono
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Architecture:
    - Overview: architecture/overview.md
    - Network Design: architecture/network.md
    - Authentication Flow: architecture/auth.md
  - Governance: governance.md
  - Joining:
    - Prerequisites: joining/prerequisites.md
    - Submit Application: joining/apply.md
    - Setup Guide: joining/setup.md
  - Technical Reference:
    - RADIUS Configuration: reference/radius.md
    - VPN Configuration: reference/vpn.md
    - BGP Integration: reference/bgp.md
    - Federation Relay: reference/relay.md
  - Members: members.md
  - Roadmap: roadmap.md

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Architecture: 架构
            Overview: 概览
            Network Design: 网络设计
            Authentication Flow: 认证流程
            Governance: 治理
            Federation Model: 联盟模型
            Joining: 加入
            Prerequisites: 前置条件
            Submit Application: 提交申请
            Setup Guide: 部署指南
            Technical Reference: 技术参考
            RADIUS Configuration: RADIUS 配置
            VPN Configuration: VPN 配置
            BGP Integration: BGP 集成
            Federation Relay: 联盟中继
            Members: 成员
            Roadmap: 路线图

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FadianRoam
    - icon: fontawesome/brands/telegram
      link: https://t.me/+WLLU-KOXcQFiMTg1
